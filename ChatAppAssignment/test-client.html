<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser Chat Test Client</title>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 30px auto;
            padding: 20px;
            background: #f7f7f7;
        }

        h2 {
            margin-bottom: 10px;
        }

        .box {
            background: white;
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 16px;
        }

        input {
            padding: 10px;
            margin-right: 8px;
            margin-bottom: 8px;
            width: calc(100% - 24px);
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            background: teal;
            color: white;
            cursor: pointer;
            margin-right: 8px;
        }

        button:hover {
            opacity: 0.9;
        }

        #messages {
            height: 350px;
            overflow-y: auto;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 12px;
        }

        .msg {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 8px;
            background: #eef7f7;
        }

        .system {
            background: #f0f0f0;
            color: #555;
            font-style: italic;
        }

        .meta {
            font-size: 12px;
            color: #777;
            margin-top: 4px;
        }

        .status {
            font-size: 14px;
            color: #333;
            margin-top: 8px;
        }
    </style>
</head>

<body>
    <h2>Browser Chat Test Client</h2>

    <div class="box">
        <input id="nameInput" type="text" placeholder="Enter your name" />
        <button onclick="joinChat()">Join Chat</button>
        <div class="status" id="statusText">Not connected</div>
    </div>

    <div class="box">
        <div id="messages"></div>
    </div>

    <div class="box">
        <input id="messageInput" type="text" placeholder="Type a message" />
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        const SERVER_URL = "http://localhost:3000";
        const socket = io(SERVER_URL, {
            transports: ["websocket"]
        });

        let userName = "";

        const statusText = document.getElementById("statusText");
        const messagesDiv = document.getElementById("messages");
        const nameInput = document.getElementById("nameInput");
        const messageInput = document.getElementById("messageInput");

        socket.on("connect", () => {
            statusText.textContent = "Connected to server: " + socket.id;
            addSystemMessage("Connected to server");
        });

        socket.on("connect_error", (error) => {
            statusText.textContent = "Connection error: " + error.message;
            addSystemMessage("Connection error: " + error.message);
        });

        socket.on("user_joined", (data) => {
            addSystemMessage(data.text, data.createdAt);
        });

        socket.on("receive_message", (data) => {
            addMessage(data.userName, data.text, data.createdAt);
        });

        function joinChat() {
            const trimmedName = nameInput.value.trim();

            if (!trimmedName) {
                alert("Please enter your name");
                return;
            }

            userName = trimmedName;
            socket.emit("join_user", userName);
            addSystemMessage(userName + " joined from browser");
        }

        function sendMessage() {
            const text = messageInput.value.trim();

            if (!userName) {
                alert("Please join chat first");
                return;
            }

            if (!text) return;

            socket.emit("send_message", {
                userName,
                text
            });

            messageInput.value = "";
        }

        function addMessage(sender, text, time) {
            const msg = document.createElement("div");
            msg.className = "msg";
            msg.innerHTML = `
        <strong>${escapeHtml(sender)}</strong><br/>
        ${escapeHtml(text)}
        <div class="meta">${formatTime(time)}</div>
      `;
            messagesDiv.appendChild(msg);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function addSystemMessage(text, time = null) {
            const msg = document.createElement("div");
            msg.className = "msg system";
            msg.innerHTML = `
        ${escapeHtml(text)}
        <div class="meta">${time ? formatTime(time) : ""}</div>
      `;
            messagesDiv.appendChild(msg);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function formatTime(time) {
            if (!time) return "";
            const date = new Date(time);
            return date.toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit"
            });
        }

        function escapeHtml(str) {
            return str
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        messageInput.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });
    </script>
</body>

</html>
